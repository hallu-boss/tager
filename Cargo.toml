[package]
name = "tager"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-native-tls", "macros"] }
thiserror = "1"
walkdir = "2.5.0"
anyhow = "1.0.100"
fs = "0.0.5"
sha2 = "0.10.9"
chrono = "0.4.42"
tempfile = "3.24.0"
notify = "8.2.0"
